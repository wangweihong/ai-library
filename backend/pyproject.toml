[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-library"
version = "0.1.0"
description = "A local library for reusable AI resources"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
ai-library = "ai_library.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_library*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
